# SC-FNO reactor parameters — version 3 (SUPERSEDES v2)
# Supersedes: configs/reactor_parameters.v2.yaml (checksum 5c7639d4...)
# Reason: Phase 0 lock had beta_eff=0.0065 quoted at 4 sig figs,
#         while the 6-group beta_i table sums to 0.006502.
#         beta_eff is now set equal to sum(beta_i) for internal consistency
#         with the equations actually integrated by the solver.
# Correction authorized by project owner; Phase 0 evidence preserved unchanged.
# Downstream impact: negligible (~2e-6 absolute, 3.1e-4 relative change to beta_eff).
# All other fields identical to v2.

neutronics:
