  beta_eff: 0.006502
  Lambda: 0.0001
  precursor_groups:
  - i: 1
    beta_i: 0.000215
    lambda_i: 0.0124
  - i: 2
    beta_i: 0.001424
    lambda_i: 0.0305
  - i: 3
    beta_i: 0.001274
    lambda_i: 0.111
  - i: 4
    beta_i: 0.002568
    lambda_i: 0.301
  - i: 5
    beta_i: 0.000748
    lambda_i: 1.14
  - i: 6
    beta_i: 0.000273
    lambda_i: 3.01
  external_source:
    include_q_t: true
    q_t_default: 0.0
initial_state:
  n0: 1.0
  T_f0: 900.0
  T_c0: 583.0
simulation:
  t_start: 0.0
  t_end: 10.0
  n_time_points: 200
  solver: BDF
  rtol: 1.0e-08
  atol: 1.0e-10
